 for(let number=1;number<=4;number++){if(!data.views.some(v=>v.cohort===cohort&&v.stages.some(s=>s.number===number)))continue;const card=el(wrap,'article');card.className='card';el(card,'h2',terms[number-1]);const body=table(card,['학부·대학','수강과목 겹침','학부 관련 과목 흩어짐']);for(const u of units){const stats=data.views.find(v=>v.unit===u&&v.cohort===cohort)?.stages.find(s=>s.number===number)?.[m],tr=el(body,'tr');el(tr,'td',u);bar(el(tr,'td'),stats?.overlap==null?null:stats.overlap*100,100,theme(u).color);bar(el(tr,'td'),stats?.spread,max,theme(u).color,true);}}
 el(root,'small','막대 눈금: 겹침 0~100%, 흩어짐 0~'+max+'%. 학과마다 개설 과목과 필수 이수 조건이 다릅니다.');}
 function drawEstimates(v){const panel=get('estimates');panel.replaceChildren();panel.hidden=!v.estimates.length;if(panel.hidden)return;el(panel,'h2','2026학번 세부전공 추정');const first=v.estimates[0];el(panel,'p','세부전공 미기록 '+first.unresolved+'명 중 자료가 있는 '+first.scored+'명의 평균 추정 확률입니다.');const cards=el(panel,'div');cards.className='estimate-cards';for(const r of [...v.estimates].sort((a,b)=>b.mean-a.mean)){const c=el(cards,'div');el(c,'span',r.target);el(c,'strong',pct(r.mean));}description(panel,'explanation-09','서로 겹치지 않는 전공 조합으로, 전체 합은 반올림 차이를 제외하면 100%입니다. 미래 선택률을 확정하는 값은 아닙니다.');description(panel,'explanation-10','2025학번의 1학년 수강 패턴과 현재 전공 기록을 기준으로 추정했습니다.');}
 function drawSubmajors(v){
   const panel=get('submajor-panel');panel.replaceChildren();
   el(panel,'h2',unit+' · '+cohort+'학번 · 자기 세부전공 개설 과목 수강');
   if(!v.submajors.length){el(panel,'p','세 번째·네 번째 학기 기록이 아직 없습니다. 2025학번을 선택하세요.');return;}
   el(panel,'p','해당 학기에 자기 세부전공에서 개설한 과목을 학생마다 몇 개 들었는지 세고, 세부전공별로 평균했습니다. 교필·전필 등 학수구분과 관계없이 계산하며, 0과목인 학생도 평균에 포함합니다.');
   if(unit.includes('프런티어'))el(panel,'p','참고치: 물리학과·생명과학과·화학과에서 전공명이 기재된 개설 과목을 각각 대응시켰습니다.');
   const label=el(panel,'label'),check=el(label,'input');check.type='checkbox';check.checked=matched;
   label.append(document.createTextNode(' 두 학기에 모두 수강 기록이 있는 학생만 비교'));
   check.onchange=()=>{matched=check.checked;drawSubmajors(v);};
   const stages=v.submajors.filter(s=>s.matched===matched);
   const wrap=el(panel,'div');wrap.className='maps';
   for(const stage of stages){
     const card=el(wrap,'article');card.className='card';el(card,'h2',terms[stage.number-1]+' · '+stage.calendar);
     const body=table(card,['세부전공','수강 학생','자기 세부전공 개설 과목 수강 (1인당 평균)']);
     for(const group of stage.groups){
       const row=el(body,'tr');el(row,'td',group.major);el(row,'td',group.n==null?'5명 미만':group.n+'명');
       el(row,'td',group.mean==null?'—':group.mean.toFixed(2)+'과목');
     }
   }
 }
 units.forEach(u=>{const b=el(get('units'),'button',u);b.onclick=()=>{unit=u;draw();};});cohorts.forEach(c=>{const b=el(get('cohorts'),'button',c+'학번');b.onclick=()=>{cohort=c;draw();};});get('common').onchange=draw;get('map-tab').onclick=()=>{tab='map';draw();};get('submajor-tab').onclick=()=>{tab='submajor';draw();};draw();
